services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanggap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tanggap}
      POSTGRES_DB: tanggap
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tanggap -d tanggap']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tanggap:${POSTGRES_PASSWORD:-tanggap}@db:5432/tanggap
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      TAMPILKAN_AKUN_CONTOH: ${TAMPILKAN_AKUN_CONTOH:-true}
      BODY_SIZE_LIMIT: 12M
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - uploads:/data/uploads

volumes:
  dbdata:
  uploads:
